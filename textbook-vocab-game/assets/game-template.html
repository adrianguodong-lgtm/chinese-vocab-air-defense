        const r = S.wordLog[w.word] || { hit:0, miss:0, typeErr:0, voiceErr:0 };
        let cls = 'none', tag = t('repNone');
        if (r.hit > 0){ cls = 'hit'; tag = t('repHit'); }
        else if (r.miss > 0){ cls = 'miss'; tag = t('repMiss'); }
        else if (r.typeErr > 0){ cls = 'type'; tag = t('repTypeErr'); }
        else if (r.voiceErr > 0){ cls = 'voice'; tag = t('repVoiceErr'); }
        const bits = [];
        if (r.typeErr) bits.push('⌨️' + r.typeErr);
        if (r.voiceErr) bits.push('🎤' + r.voiceErr);
        if (r.miss) bits.push('⏰' + r.miss);
        if (TTS_WORDS.has(w.word)) bits.push('🔈');
        const sub = (LANG === 'zh') ? w.pinyin : (WORD_EN[w.word] || w.pinyin);
        return '<div class="rep-item ' + cls + '">' +
            '<div class="w">' + w.word + '</div>' +
            '<div class="p">' + sub + '</div>' +
            '<div class="tag">' + tag + '</div>' +
            (bits.length ? '<div class="cnt">' + bits.join(' ') + '</div>' : '') +
        '</div>';
    }).join('');

    const typeW = WORDS.filter(w => (S.wordLog[w.word] || {}).typeErr > 0);
    const voiceW = WORDS.filter(w => (S.wordLog[w.word] || {}).voiceErr > 0);
    const missW = WORDS.filter(w => (S.wordLog[w.word] || {}).miss > 0);
    const sum = (arr, k) => arr.reduce((a, w) => a + S.wordLog[w.word][k], 0);
    const typeN = sum(typeW, 'typeErr'), voiceN = sum(voiceW, 'voiceErr'), missN = sum(missW, 'miss');

    const rows = [];
    const SEP = (LANG === 'zh' ? '、' : ', ');
    const COLON = (LANG === 'zh' ? '：' : ': ');
    if (typeW.length) rows.push('<div class="d-row"><b>' + tf('diagTypeHead', { n:typeN }) + '</b>' + COLON + '<span class="d-list">' +
        typeW.map(w => w.word + '×' + S.wordLog[w.word].typeErr).join(SEP) + '</span></div>');
    if (voiceW.length) rows.push('<div class="d-row"><b>' + tf('diagVoiceHead', { n:voiceN }) + '</b>' + COLON + '<span class="d-list">' +
        voiceW.map(w => w.word + '×' + S.wordLog[w.word].voiceErr).join(SEP) + '</span></div>');
    if (missW.length) rows.push('<div class="d-row"><b>' + tf('diagMissHead', { n:missN }) + '</b>' + COLON + '<span class="d-list">' +
        missW.map(w => w.word).join(SEP) + '</span></div>');

    let concl;
    if (typeN && voiceN) concl = tf('diagMainBoth', { a:typeN, b:voiceN });
    else if (typeN) concl = tf('diagMainType', { n:typeN });
    else if (voiceN) concl = tf('diagMainVoice', { n:voiceN });
    else if (missN) concl = tf('diagMainMiss', { n:missN });
    else concl = t('diagNone');

    return '<div class="report">' +
        '<div class="rep-title">' + t('repTitle') + '</div>' +
        '<div class="rep-grid">' + cells + '</div>' +
        '<div class="diag">' +
            '<div class="d-title">' + t('diagTitle') + '</div>' +
            (rows.length ? rows.join('') : '<div class="d-row">' + t('diagPerfect') + '</div>') +
            '<div class="d-concl">' + concl + '</div>' +
        '</div>' +
    '</div>';
}
function bestHTML(best){
    return '<div class="bestline"><span class="bl-k">' + tf('bestOf', { d: t(DIFF[S.diff].nameKey) }) +
        '</span><span class="bl-v">' + best + '</span></div>';
}
function renderGameOver(){
    const best = saveHigh();
    overlay.classList.remove('hide');
    overlay.innerHTML =
        '<div class="panel wide">' +
            '<h2>' + t('overTitle') + '</h2>' +
            '<div class="lead">' + t('overLead') + '</div>' +
            statHTML() + reportHTML() + bestHTML(best) +
            '<div class="actions">' +
                '<button class="btn primary" id="again">' + t('again') + '</button>' +
                '<button class="btn" id="backHome">' + t('backHome') + '</button>' +
            '</div>' +
        '</div>';

function gameOver(){
    if (!S.running) return;
    S.running = false; S.paused = true;
    stopListening();
    stopSpeaking();
    clearField(); stage.classList.add('paused');
    aim.style.transform = 'rotate(0deg)';
    SFX.over();
    cmdReact('sad', t('cmdLose'), 3000);
    renderGameOver();
    lastOverlay = renderGameOver;
    syncUI();
}
function renderVictory(){
    const best = saveHigh();
    const firstTime = !localStorage.getItem('kongxizhan_endless');
    localStorage.setItem('kongxizhan_endless', '1');
    overlay.classList.remove('hide');
    overlay.innerHTML =
        '<div class="panel wide">' +
            '<h2>' + t('winTitle') + '</h2>' +
            '<div class="lead">' + tf('winLead', { n: WORDS.length }) + (firstTime ? t('winUnlock') : '') + '</div>' +
            statHTML() + reportHTML() + bestHTML(best) +
            '<div class="actions">' +
                '<button class="btn gold" id="endlessBtn">' + t('endlessBtn') + '</button>' +
                '<button class="btn primary" id="again">' + t('again') + '</button>' +
                '<button class="btn" id="backHome">' + t('backHome') + '</button>' +
            '</div>' +
        '</div>';
    $('endlessBtn').onclick = () => startGame('endless');
    $('again').onclick = () => startGame('campaign');
    $('backHome').onclick = showMenu;
}
function victory(){
    if (!S.running) return;
    S.running = false; S.paused = true;
    stopListening();
    stopSpeaking();
    clearField(); stage.classList.add('paused');
    aim.style.transform = 'rotate(0deg)';
    SFX.win();
    cmdReact('cheer', t('cmdWin'), 3000);
    renderVictory();
    lastOverlay = renderVictory;
    syncUI();

/* =========================================================
   首页
   ========================================================= */
let menuView = 'home';
function saveNameIfAny(){
    const inp = $('nameInput');
    if (inp && inp.value.trim()){
        S.player = inp.value.trim().slice(0, 12);
        localStorage.setItem('kongxizhan_name', S.player);
        updateWho();
    }
}
function showMenu(view){
    menuView = view === 'levels' ? 'levels' : 'home';
    S.running = false; S.paused = false;
    stopListening();
    stopSpeaking();
    clearField(); stage.classList.remove('paused');
    aim.style.transform = 'rotate(0deg)';
    const bestC = localStorage.getItem('kongxizhan_bk3_l3_v1_high_campaign_' + S.diff) || 0;
    const bestE = localStorage.getItem('kongxizhan_bk3_l3_v1_high_endless_' + S.diff) || 0;
    overlay.classList.remove('hide');

    const nameBox =
        '<div class="namebox">' +
            '<label for="nameInput">' + t('nameLabel') + '</label>' +
            '<input class="nameinput" id="nameInput" maxlength="12" autocomplete="off" ' +
                'placeholder="' + t('namePlaceholder') + '" value="' + (S.player || '') + '">' +
        '</div>';
    const diffBox =
        '<div class="seg">' +
            '<button data-d="easy" class="' + (S.diff === 'easy' ? 'on' : '') + '">🌤️ ' + t('diffEasy') + '</button>' +
            '<button data-d="normal" class="' + (S.diff === 'normal' ? 'on' : '') + '">⛅ ' + t('diffNormal') + '</button>' +
            '<button data-d="hard" class="' + (S.diff === 'hard' ? 'on' : '') + '">🌪️ ' + t('diffHard') + '</button>' +
        '</div>';

    if (menuView === 'home'){
        overlay.innerHTML =
            '<div class="panel">' +
                '<h2>' + t('brandName') + '</h2>' +
                '<div class="lead">' + t('menuLead') + '</div>' +
                nameBox + diffBox +
                '<button class="btn-start" id="startC">' + t('menuStart') + '</button>' +
                '<div class="actions" style="margin-top:10px">' +
                    '<button class="btn gold" id="pickLevel">' + t('menuPick') + '</button>' +
                '</div>' +
                '<div class="actions" style="margin-top:8px">' +
                    '<button class="btn" id="startE">' + t('endless') + '</button>' +
                    '<button class="btn" id="book2">' + t('book') + '</button>' +
                '</div>' +
                '<div class="mini">' +
                    '<b>' + t(DIFF[S.diff].nameKey) + '</b> · ' + t('bestCampaign') + ' <b>' + bestC + '</b>' +
                    ' · ' + t('bestEndless') + ' <b>' + bestE + '</b> · ' + t('wordCount') + ' <b>' + WORDS.length + '</b><br>' +
                    t('menuRules') + '<br>' + t('menuVoice') +
                '</div>' +
            '</div>';
    } else {
        overlay.innerHTML =
            '<div class="panel">' +
                '<h2>' + t('menuPickTitle') + '</h2>' +
                '<div class="lead">' + t('menuLead') + '</div>' +
                nameBox +
                '<div class="levelcards">' +
                    '<button class="lvl l1" data-r="0"><span class="ln">' + t('lvl1Name') + '</span><span class="ld">' + t('lvl1Desc') + '</span></button>' +
                    '<button class="lvl l2" data-r="1"><span class="ln">' + t('lvl2Name') + '</span><span class="ld">' + t('lvl2Desc') + '</span></button>' +
                    '<button class="lvl l3" data-r="2"><span class="ln">' + t('lvl3Name') + '</span><span class="ld">' + t('lvl3Desc') + '</span></button>' +
                    '<button class="lvl l4" data-r="3"><span class="ln">' + t('lvl4Name') + '</span><span class="ld">' + t('lvl4Desc') + '</span></button>' +
                '</div>' +
                '<div class="actions" style="margin-top:12px">' +
                    '<button class="btn" id="backMenu">' + t('menuBack') + '</button>' +
                '</div>' +
            '</div>';
    }
    lastOverlay = () => showMenu(menuView);

    overlay.querySelectorAll('.seg button').forEach(b => {
        b.onclick = () => {
            S.diff = b.dataset.d;
            localStorage.setItem('kongxizhan_diff', S.diff);
            SFX.hit();
            showMenu(menuView);
        };
    });
    const begin = (mode, round) => {
        if (requireName() === null) return;
        startGame(mode, round);
    };
    const $id = id => overlay.querySelector('#' + id);
    if ($id('startC')) $id('startC').onclick = () => begin('campaign', 0);
    if ($id('pickLevel')) $id('pickLevel').onclick = () => { saveNameIfAny(); showMenu('levels'); };
    if ($id('backMenu')) $id('backMenu').onclick = () => { saveNameIfAny(); showMenu('home'); };
    if ($id('startE')) $id('startE').onclick = () => begin('endless', 0);
    if ($id('book2')) $id('book2').onclick = () => $('drawer').classList.add('open');
    overlay.querySelectorAll('.lvl').forEach(b => {
        b.onclick = () => begin('campaign', +b.dataset.r);
    });
    syncUI();
}

/* =========================================================
   输入
   ========================================================= */
input.addEventListener('input', e => {
    if (e.isComposing) return;
    tryShoot(input.value);
});
input.addEventListener('compositionend', () => setTimeout(() => tryShoot(input.value), 0));
input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
        e.preventDefault();
        if (input.value){
            const v = norm(input.value);
            const hit = S.active.some(p => p.keys.includes(v));
            if (!hit){
                S.wrong++; S.combo = 0; SFX.wrong();
                attrTypeError(input.value);
                input.classList.add('bad');
                setTimeout(() => input.classList.remove('bad'), 360);
                syncUI();
            }
        }
        input.value = '';
        [...planesLayer.children].forEach(c => c.classList.remove('locked'));
    }
    if (e.key === 'Escape'){ e.preventDefault(); togglePause(); }
});

/* =========================================================
   控制
   ========================================================= */
function togglePause(){
    if (!S.running || S.ending) return;
    S.paused = !S.paused;
    stage.classList.toggle('paused', S.paused);
    if (S.paused){
        stopListening();
        stopSpeaking();
        overlay.classList.remove('hide');
        overlay.innerHTML =
            '<div class="panel">' +
                '<h2>' + t('pausedTitle') + '</h2>' +
                '<div class="lead">' + t('pausedLead') + '</div>' +
                '<button class="btn-start" id="resume" style="font-size:20px">' + t('resumeGame') + '</button>' +
                '<div class="actions" style="margin-top:10px">' +
                    '<button class="btn" id="backHome2">' + t('backHome') + '</button></div>' +
            '</div>';
        lastOverlay = togglePause;
        $('resume').onclick = togglePause;
        $('backHome2').onclick = showMenu;
    } else {
        overlay.classList.add('hide');
        if (isVoiceRound()) startListening();
        input.focus();
    }
    syncUI(); updateMic();
}
$('btnPause').onclick = togglePause;
$('btnHome').onclick = () => { saveNameIfAny(); $('drawer').classList.remove('open'); showMenu('home'); };
$('btnSound').onclick = () => {
    muted = !muted;
    localStorage.setItem('kongxizhan_muted', muted ? '1' : '0');
    syncSpeakVolume();
    if (!muted) SFX.hit();
    syncUI();
};
$('btnRead').onclick = () => {
    readOn = !readOn;
    localStorage.setItem('kongxizhan_read', readOn ? '1' : '0');
    if (!readOn) stopSpeaking();
    applyStaticText();
    toast(readOn ? t('readOn') : t('readOff'));
};
$('btnLang').onclick = () => {
    LANG = (LANG === 'zh') ? 'en' : 'zh';
    localStorage.setItem('kongxizhan_lang', LANG);
    applyStaticText();
    syncUI();
    showHint();
    if (!overlay.classList.contains('hide') && lastOverlay) lastOverlay();
    buildWordList();
};
$('btnBook').onclick = () => $('drawer').classList.add('open');
/* 全屏：优先使用 Fullscreen API；若浏览器不支持或被拒绝，
   降级为 CSS 模拟全屏（html.fs-sim），观感一致。 */
function isFullscreenNow(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement)
        || document.documentElement.classList.contains('fs-sim');
}
function refreshFullBtn(){
    $('btnFull').textContent = isFullscreenNow() ? t('btnFullExit') : t('btnFull');
}
$('btnFull').onclick = () => {
    const el = document.documentElement;
    const isApiFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (isApiFs){
        try {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (exit) exit.call(document);
        } catch (e){ toast(t('fullscreenFail')); }
        return;
    }
    if (el.classList.contains('fs-sim')){ el.classList.remove('fs-sim'); refreshFullBtn(); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req){ el.classList.add('fs-sim'); refreshFullBtn(); return; }
    // 无论 Promise 是否 settle，都用超时兜底：800ms 后仍未进入全屏 → 降级模拟全屏
    let settled = false;
    const fallback = () => {
        if (settled) return;
        settled = true;
        if (!(document.fullscreenElement || document.webkitFullscreenElement)){
            el.classList.add('fs-sim');
            toast(t('fullscreenSim'));
        }
        refreshFullBtn();
    };
    setTimeout(fallback, 800);
    try {
        const p = req.call(el);
        if (p && typeof p.then === 'function'){
            p.then(function(){ settled = true; el.classList.remove('fs-sim'); refreshFullBtn(); })
             .catch(function(){ fallback(); });
        }
    } catch (e){
        fallback();
    }
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev =>
    document.addEventListener(ev, () => {
        if (!(document.fullscreenElement || document.webkitFullscreenElement)){
            document.documentElement.classList.remove('fs-sim');
        }
        refreshFullBtn();
        if (!isFullscreenNow() && S.running && !S.paused) setTimeout(() => input.focus(), 60);
    })
);
/* Esc 优先退出模拟全屏（此时不应同时触发游戏暂停） */
window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.documentElement.classList.contains('fs-sim')){
        e.preventDefault();
        e.stopPropagation();
        document.documentElement.classList.remove('fs-sim');
        refreshFullBtn();
    }
}, true);
$('btnCloseDrawer').onclick = () => $('drawer').classList.remove('open');

stage.addEventListener('mousedown', e => {
    if (!overlay.contains(e.target)) setTimeout(() => input.focus(), 0);
});
window.addEventListener('blur', () => {
    // 麦克风授权框也会让窗口失焦，但它不是玩家离开游戏。
    if (S.running && !S.paused && !micPromptOpen) togglePause();
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !S.running) return;
    if (e.key === 'Escape' && document.activeElement !== input) togglePause();
    if (e.key === 'Enter' && document.activeElement !== input){
        const go = overlay.querySelector('#startC') || overlay.querySelector('#again') || overlay.querySelector('#goNext');
        if (go && !overlay.classList.contains('hide')){ e.preventDefault(); go.click(); }
    }
});

/* =========================================================
   启动
   ========================================================= */
S.diff = localStorage.getItem('kongxizhan_diff') || 'normal';
if (!I18N[LANG]) LANG = 'zh';
buildWordList();
applyStaticText();
showMenu();
</script>
