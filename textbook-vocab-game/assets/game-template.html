<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词汇防空战 · 第三册第3课词汇1</title>
<style>
    :root{
        --ink:#22303f;
        --muted:#6b7c8f;
        --brand:#2f7ef7;
        --brand2:#12c2e9;
        --gold:#ffb020;
        --red:#ff5a5f;
        --green:#22c55e;
        --panel:rgba(255,255,255,.82);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
        margin:0;
        font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
        color:var(--ink);
        background:
            radial-gradient(1200px 600px at 15% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
            radial-gradient(1000px 500px at 100% 0%, #e3f0ff 0%, rgba(227,240,255,0) 55%),
            linear-gradient(160deg,#eef4fb 0%, #e6eef8 55%, #f3f7fc 100%);
        min-height:100%;
        display:flex; align-items:center; justify-content:center;
        padding:18px;
    }
    .app{
        width:100%; max-width:1460px;
        background:rgba(255,255,255,.72);
        backdrop-filter:blur(10px);
        border:1px solid rgba(255,255,255,.9);
        border-radius:26px;
        box-shadow:0 18px 50px rgba(31,52,84,.14);
        padding:16px 18px 14px;
        display:flex; flex-direction:column; gap:12px;
    }
    /* ---------- 全屏模式 ----------
       全屏目标是 documentElement，因此规则挂在 html:fullscreen 上 */
    html:fullscreen, html:-webkit-full-screen{ background:#eaf1fa; }
    html:fullscreen body, html:-webkit-full-screen body{
        padding:10px; align-items:stretch;
    }
    html:fullscreen .app, html:-webkit-full-screen .app{
        max-width:none; width:100%; height:100%; border-radius:18px;
        background:rgba(255,255,255,.9);
        display:flex; flex-direction:column; gap:12px;
    }
    html:fullscreen .layout, html:-webkit-full-screen .layout{
        flex:1; min-height:0; grid-template-rows:1fr; align-items:stretch;
    }
    html:fullscreen .stage, html:-webkit-full-screen .stage{ height:auto; }
    html:fullscreen .rail, html:-webkit-full-screen .rail{ max-height:100%; overflow:auto; }
    /* 全屏：左栏独立滚动，战场占满剩余空间 */
    html:fullscreen .rail-l, html:-webkit-full-screen .rail-l{ overflow:auto; }

    /* 降级方案：浏览器不支持 Fullscreen API 时，用 CSS 模拟全屏铺满 */
    html.fs-sim, html.fs-sim body{ background:#eaf1fa; }
    html.fs-sim body{ padding:0; align-items:stretch; display:block; }
    html.fs-sim .app{
        max-width:none; width:100%; height:100vh; border-radius:0; border:none;
        background:rgba(255,255,255,.9);
        display:flex; flex-direction:column; gap:12px;
    }
    html.fs-sim .layout{
        flex:1; min-height:0; grid-template-rows:1fr; align-items:stretch;
    }
    html.fs-sim .stage{ height:auto; }
    html.fs-sim .rail{ max-height:100%; overflow:auto; }
    html.fs-sim .rail-l{ overflow:auto; }

    /* ---------- 顶部 ---------- */
    .title-bar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:12px; }
    .brand .logo{
        width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;
        background:linear-gradient(135deg,var(--brand),var(--brand2));
        box-shadow:0 8px 18px rgba(47,126,247,.35);
    }
    .brand h1{
        margin:0;font-size:26px;letter-spacing:.5px;
        background:linear-gradient(90deg,#2f7ef7,#12c2e9 60%,#ffb020);
        -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .brand .sub{ font-size:13px;color:var(--muted);margin-top:2px; }

    .tools{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{
        border:1px solid rgba(47,126,247,.25);
        background:rgba(255,255,255,.9);
        color:var(--ink);
        font-size:14px; padding:9px 15px; border-radius:12px;
        cursor:pointer; font-family:inherit; transition:.18s; white-space:nowrap;
    }
    .btn:hover{ transform:translateY(-2px); box-shadow:0 8px 16px rgba(31,52,84,.12); }
    .btn.primary{
        background:linear-gradient(135deg,var(--brand),var(--brand2));
        color:#fff;border-color:transparent;font-weight:600;
        box-shadow:0 10px 22px rgba(47,126,247,.35);
    }
    .btn.gold{
        background:linear-gradient(135deg,#ffb020,#ff8a00);
        color:#fff;border-color:transparent;font-weight:600;
        box-shadow:0 10px 22px rgba(255,138,0,.32);
    }
    .btn:active{ transform:translateY(0) scale(.98); }
    .btn.lang{ font-weight:700; color:var(--brand); border-color:rgba(47,126,247,.45); }
    .btn.voice{
        background:linear-gradient(135deg,#7c4dff,#e040fb 60%,#ff5a8a);
        color:#fff;border-color:transparent;font-weight:700;
        box-shadow:0 10px 22px rgba(150,60,220,.32);
    }

    /* ---------- 玩家名字 ---------- */
    .who{
        display:inline-flex; align-items:center; gap:6px; margin-top:7px;
        background:var(--panel); border:1px solid rgba(255,255,255,.9);
        border-radius:99px; padding:3px 12px; font-size:12px; font-weight:700; color:var(--brand);
    }
    .namebox{ margin:14px 0 12px; text-align:left; }
    .namebox label{ display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:7px; }
    .nameinput{
        width:100%; border:1px solid rgba(47,126,247,.25); border-radius:12px;
        padding:12px 14px; font-size:16px; font-family:inherit; color:var(--ink);
        background:#fff; outline:none; transition:.18s;
    }
    .nameinput:focus{ border-color:var(--brand); box-shadow:0 0 0 4px rgba(47,126,247,.16); }
    .nameinput.bad{ border-color:var(--red); box-shadow:0 0 0 4px rgba(255,90,95,.18); }

    /* ---------- 关卡选择卡片 ---------- */
    .levelcards{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
    .lvl{
        display:flex; align-items:center; gap:14px; text-align:left; cursor:pointer;
        font-family:inherit; background:#fff; border:1px solid rgba(47,126,247,.2);
        border-radius:16px; padding:14px 18px; transition:.18s;
    }
    .lvl:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(31,52,84,.12); }
    .lvl .ln{ font-size:17px; font-weight:800; color:var(--ink); min-width:58px; }
    .lvl .ld{ font-size:14px; color:var(--muted); }
    .lvl.l1{ border-left:7px solid var(--brand); }
    .lvl.l2{ border-left:7px solid var(--gold); }
    .lvl.l3{ border-left:7px solid #a855f7; }
    .lvl.l4{ border-left:7px solid #ef4444; }

    /* ---------- 两栏布局：左侧功能+说明 / 中间战场（战场吃掉全部剩余空间） ---------- */
    .layout{
        display:grid;
        grid-template-columns:214px minmax(0,1fr);
        gap:14px; align-items:start;
    }
    .rail{ display:flex; flex-direction:column; gap:12px; min-width:0; }
    .rail-card{
        background:var(--panel); border:1px solid rgba(255,255,255,.9);
        border-radius:18px; padding:12px 13px;
        box-shadow:0 6px 18px rgba(31,52,84,.08);
    }
    .rail-h{
        font-size:12px; font-weight:800; color:var(--brand);
        letter-spacing:1px; margin-bottom:9px;
        display:flex; align-items:center; gap:6px;
    }
    .rail-h::after{ content:''; flex:1; height:1px; background:rgba(47,126,247,.16); }
    .rail .hint{ font-size:12.5px; line-height:1.85; color:var(--muted); }
    .rail .hint b{ color:var(--ink); }
    .rail .kbd-row{ margin-top:9px; font-size:12px; color:var(--muted); line-height:2; }
    /* ---------- 结算面板：完整词表 + 错因分析 ---------- */
    .report{
        text-align:left;background:#f7faff;border:1px solid #dce8fb;border-radius:16px;
        padding:11px 13px;margin:0 0 6px;
    }
    .bestline{
        display:flex;align-items:center;justify-content:center;gap:8px;
        background:#f5f8fc;border-radius:12px;padding:5px 14px;margin:0 0 8px;
        font-size:13px;color:var(--muted);
    }
    .bestline .bl-v{ font-size:19px;font-weight:800;color:var(--brand); }
    .report .rep-title{
        font-size:14px;font-weight:800;color:var(--brand);margin-bottom:10px;
        display:flex;align-items:center;gap:6px;
    }
    .report .rep-title::after{ content:'';flex:1;height:1px;background:rgba(47,126,247,.16); }
    .rep-grid{ display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px; }
    .panel.wide .rep-grid{ grid-template-columns:repeat(8,minmax(0,1fr));gap:5px; }
    @media (max-width:900px){ .panel.wide .rep-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
    .rep-item{
        background:#fff;border-radius:10px;padding:5px 8px;border-left:4px solid #cfd8e3;min-width:0;
    }
    .rep-item .w{ font-size:15px;font-weight:700;line-height:1.2; }
    .rep-item .p{ font-size:10px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .rep-item .tag{ font-size:11px;font-weight:700;margin-top:2px;line-height:1.3; }
    .rep-item .cnt{ font-size:10px;color:#7b8794;margin-top:1px; }
    .rep-item.hit{ border-left-color:var(--green);background:#f3fdf6; }
    .rep-item.hit .tag{ color:var(--green); }
    .rep-item.type{ border-left-color:#f59e0b;background:#fffaf0; }
    .rep-item.type .tag{ color:#d97706; }
    .rep-item.voice{ border-left-color:#a855f7;background:#faf5ff; }
    .rep-item.voice .tag{ color:#9333ea; }
    .rep-item.miss{ border-left-color:#ef4444;background:#fff6f6; }
    .rep-item.miss .tag{ color:#dc2626; }
    .rep-item.none{ opacity:.7; }
    .rep-item.none .tag{ color:#8a97a8; }
    .diag{ margin-top:10px;border-top:1px dashed #d3e0f2;padding-top:9px; }
    .diag .d-title{ font-size:13px;font-weight:800;color:var(--ink);margin-bottom:4px; }
    .diag .d-row{ font-size:12.5px;line-height:1.6;color:#4a5b70; }
    .diag .d-row b{ color:var(--ink); }
    .diag .d-list{ color:var(--brand);font-weight:700; }
    .diag .d-concl{
        margin-top:7px;background:#eef5ff;border:1px solid #cfe3ff;border-radius:11px;
        padding:7px 11px;font-size:12.5px;line-height:1.7;color:#2a5b8a;
    }
    @media (max-width:640px){ .rep-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

    /* ---------- HUD ---------- */
    .hud{ display:flex; flex-direction:column; gap:7px; }
    .rail .chip{
        display:flex; align-items:center; justify-content:space-between; gap:8px;
        padding:6px 10px; border-radius:11px;
    }
    .rail .chip .v{ font-size:17px; }
    .chip{
        background:var(--panel); border:1px solid rgba(255,255,255,.9);
        border-radius:14px; padding:8px 12px;
        box-shadow:0 4px 14px rgba(31,52,84,.06); min-width:0;
    }
    .chip .k{ font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap; }
    .chip .v{ font-size:22px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .chip.score .v{ color:var(--brand); }
    .chip.combo .v{ color:var(--gold); }
    .chip.life .v{ color:var(--red); letter-spacing:2px; }
    .chip.life .v .dim{ color:#cdd6e0; }
    .chip.round .v{ color:#7c4dff; font-size:19px; }
    .chip.prog .v{ color:var(--green); }
    .chip.combo.hot{ animation:pulse .45s ease; }
    @keyframes pulse{ 0%{transform:scale(1)} 45%{transform:scale(1.09)} 100%{transform:scale(1)} }

    /* ---------- 舞台 ---------- */
    .stage{
        position:relative;
        height:clamp(520px, 74vh, 820px);
        border-radius:22px; overflow:hidden;
        border:1px solid rgba(255,255,255,.6);
        box-shadow:inset 0 -10px 40px rgba(0,0,0,.12), 0 12px 30px rgba(31,52,84,.16);
        background:linear-gradient(180deg,#3aa7f0 0%, #7fd3ff 42%, #bfe9ff 68%, #ffe9c4 100%);
        user-select:none; cursor:crosshair;
    }
    .sun{
        position:absolute; right:8%; top:9%; width:104px;height:104px;border-radius:50%;
        background:radial-gradient(circle at 40% 40%, #fff6c9, #ffd85e 55%, rgba(255,216,94,.15) 72%);
        box-shadow:0 0 70px 30px rgba(255,214,90,.35);
        animation:sunPulse 6s ease-in-out infinite;
    }
    @keyframes sunPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    .cloud{
        position:absolute; border-radius:999px; background:rgba(255,255,255,.92);
        box-shadow:38px 6px 0 -8px rgba(255,255,255,.92), -34px 9px 0 -12px rgba(255,255,255,.92);
        animation:drift linear infinite;
    }
    @keyframes drift{ from{ left:-220px; } to{ left:115%; } }
    .hill{ position:absolute; border-radius:50% 50% 0 0 / 100% 100% 0 0; opacity:.85; }
    .hill.h1{ left:-8%; bottom:62px; width:56%; height:210px; background:#57bd6b; }
    .hill.h2{ right:-6%; bottom:62px; width:48%; height:170px; background:#3f9e58; }
    .hill.h3{ left:34%; bottom:62px; width:40%; height:130px; background:#6ac97c; opacity:.75; }
    .ground{
        position:absolute;left:0;right:0;bottom:0;height:74px;
        background:linear-gradient(180deg,#3fa34d 0%, #2f8a42 40%, #25703a 100%);
    }
    .ground::before{
        content:"";position:absolute;left:0;right:0;top:0;height:10px;
        background:repeating-linear-gradient(90deg,#4bb85c 0 14px,#43ac54 14px 28px);
    }
    canvas#fx{ position:absolute; inset:0; width:100%; height:100%; z-index:30; pointer-events:none; }

    /* ---------- 轰炸机 + 炸弹 ---------- */
    .plane{
        position:absolute; left:-140px; z-index:22;
        animation:fly linear forwards;
    }
    /* 起点 -140px：机身与最宽词卡（139px）都完全位于屏幕左侧之外，
       飞机一出现就能较快地让词卡完整进入画面 */
    @keyframes fly{ from{ left:-140px; } to{ left:100%; } }
    /* 机身容器宽度固定 = 轰炸机宽度，保证词卡的横向定位稳定 */
    .plane-inner{ display:flex; flex-direction:column; align-items:center; width:132px; }
    .bomber{
        width:132px; height:auto; display:block;
        filter:drop-shadow(0 7px 9px rgba(0,0,0,.3));
        animation:bob 1.6s ease-in-out infinite;
    }
    /* 轰炸机渐变定义（全局共用一份，避免每架飞机重复 id） */
    .svg-defs{ position:absolute; width:0; height:0; overflow:hidden; pointer-events:none; }
    @keyframes bob{ 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-5px) rotate(-2deg)} }
    /* 统一的生字词卡：所有词形式完全相同（不再使用炸弹），
       宽度自适应内容 —— 拼音与汉字都单行完整显示，绝不截断 */
    .wordtag{
        position:relative; z-index:2; margin-top:-7px;
        display:flex; flex-direction:column; align-items:center; gap:1px;
        width:max-content; min-width:74px; max-width:196px;
        padding:5px 12px 6px; text-align:center;
        background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(226,238,250,.96));
        border:2px solid #1b222b; border-radius:13px;
        box-shadow:0 8px 18px rgba(0,0,0,.32), inset 0 2px 0 rgba(255,255,255,.8);
        transition:transform .16s, box-shadow .16s;
    }
    .wordtag::before{  /* 挂绳：把词卡吊在机腹下 */
        content:''; position:absolute; left:50%; top:-9px; width:2px; height:9px; margin-left:-1px;
        background:#8a94a6; border-radius:1px;
    }
    /* 读音（拼音）必须完整显示 */
    .wordtag .pinyin{
        font-size:12px; color:#2f6f9e; letter-spacing:.2px; min-height:15px; font-weight:700;
        white-space:nowrap; line-height:1.25;
    }
    /* 汉字必须完整显示 */
    .wordtag .word{
        font-size:clamp(16px, 1.6vw, 21px); font-weight:800; color:#1d2b3a; line-height:1.2; letter-spacing:.5px;
        white-space:nowrap;
    }
    /* ---------- 漏词炸弹：落在指挥官旁边 ---------- */
    .missbombs{ display:flex; align-items:flex-end; gap:3px; flex-wrap:wrap-reverse; max-width:150px; }
    .missbomb{
        position:relative; width:26px; height:32px; flex:0 0 auto;
        animation:bombDrop .78s cubic-bezier(.25,.85,.35,1) both;
    }
    .missbomb::before{   /* 弹体 */
        content:''; position:absolute; left:0; right:0; bottom:0; height:23px;
        background:radial-gradient(circle at 34% 28%, #6d7887, #2c343e 62%, #171c23);
        border-radius:50% 50% 42% 42% / 62% 62% 38% 38%;
        box-shadow:0 3px 6px rgba(0,0,0,.35);
    }
    .missbomb::after{    /* 尾翼 */
        content:''; position:absolute; left:4px; right:4px; bottom:0; height:8px;
        background:#1b222b; clip-path:polygon(0 0,100% 0,72% 100%,28% 100%);
    }
    .missbomb i{         /* 引信 */
        position:absolute; left:50%; top:-7px; width:13px; height:8px; margin-left:-6.5px;
        border-left:2px solid #c9a25c; border-top:2px solid #c9a25c; border-radius:70% 0 0 0;
        transform:rotate(14deg);
    }
    .missbomb i::after{
        content:''; position:absolute; right:-4px; top:-6px; width:8px; height:8px; border-radius:50%;
        background:#ffcf5c; box-shadow:0 0 10px 4px rgba(255,170,40,.7);
        animation:spark .34s ease-in-out infinite alternate;
    }
    @keyframes spark{ from{ transform:scale(.75); opacity:.7 } to{ transform:scale(1.3); opacity:1 } }
    @keyframes bombDrop{
        0%{ transform:translateY(-300px) rotate(-16deg); opacity:0; }
        12%{ opacity:1; }
        68%{ transform:translateY(0) rotate(5deg); }
        82%{ transform:translateY(-11px) rotate(-3deg); }
        100%{ transform:translateY(0) rotate(0); }
    }
    .fuel{
        width:66px; height:4px; margin-top:7px;
        background:rgba(255,255,255,.55); border-radius:99px; overflow:hidden;
        box-shadow:0 2px 6px rgba(0,0,0,.25);
    }
    .fuel i{
        display:block;height:100%;width:100%;border-radius:99px;
        background:linear-gradient(90deg,#22c55e,#ffb020);
        animation:fuel linear forwards;
    }
    @keyframes fuel{ from{width:100%} to{width:0%} }
    .reticle{
        position:absolute;inset:-10px;border-radius:22px;
        border:3px dashed var(--gold); opacity:0; transition:opacity .15s; pointer-events:none;
    }
    .reticle::after{ content:"🎯";position:absolute;right:-13px;top:-15px;font-size:17px; }
    .plane.locked .wordtag{
        border-color:var(--gold);
        box-shadow:0 0 0 4px rgba(255,176,32,.28), 0 10px 22px rgba(0,0,0,.3);
        transform:scale(1.06);
    }
    .plane.locked .reticle{ opacity:1; animation:reticlePulse .9s ease-in-out infinite; }
    @keyframes reticlePulse{
        0%,100%{ transform:scale(1); opacity:.65; }
        50%{ transform:scale(1.035); opacity:1; }
    }
    /* 正在朗读的词卡 */
    .plane.reading .wordtag{
        box-shadow:0 0 0 4px rgba(255,207,92,.75), 0 10px 22px rgba(0,0,0,.32);
        animation:readGlow .8s ease-in-out infinite;
    }
    @keyframes readGlow{
        0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.18) }
    }
    .plane.doomed{ animation-play-state:paused; }
    .plane.doomed .plane-inner{ opacity:.7; }
    .plane.crash .plane-inner{ animation:crash .65s ease-in forwards; }
    @keyframes crash{
        0%{ transform:translate(0,0) rotate(0); opacity:1; }
        100%{ transform:translate(30px,240px) rotate(115deg); opacity:0; }
    }
    .stage.paused .plane, .stage.paused .plane *{ animation-play-state:paused !important; }

    /* ================= 高射炮 ================= */
    .gun{
        position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
        z-index:40; width:min(420px,88%);
        display:flex; flex-direction:column; align-items:center;
    }
    /* 双联装炮组：绕炮座中心俯仰旋转 */
    .gun-aim{
        position:relative; width:112px; height:96px;
        display:flex; justify-content:center; align-items:flex-end; gap:11px;
        transform-origin:50% 100%;
        transition:transform .16s ease-out;
        z-index:3;
    }
    .barrel{
        position:relative; width:13px; height:82px;
        border-radius:4px 4px 3px 3px;
        background:linear-gradient(90deg,#2b332a 0%,#6d7a5f 34%,#9aa88a 48%,#55614a 68%,#232a21 100%);
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.45), 0 2px 5px rgba(0,0,0,.35);
        transition:transform .07s ease-out;
    }
    /* 复进筒（炮身根部加粗，带加强箍） */
    .barrel::before{
        content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
        width:22px; height:36px; border-radius:5px 5px 3px 3px;
        background:linear-gradient(90deg,#242b22,#63705a 42%,#2a3226);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 0 0 1px rgba(0,0,0,.3);
    }
    /* 炮口制退器 */
    .barrel::after{
        content:''; position:absolute; top:-13px; left:50%; transform:translateX(-50%);
        width:20px; height:15px; border-radius:3px;
        background:linear-gradient(90deg,#1f261d,#78866a 45%,#1f261d);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 1px 3px rgba(0,0,0,.4);
    }
    /* 制退器排气槽 */
    .barrel .slot{
        position:absolute; top:-9px; left:50%; transform:translateX(-50%);
        width:14px; height:2px; border-radius:2px;
        background:rgba(0,0,0,.55);
        box-shadow:0 4px 0 rgba(0,0,0,.55);
        z-index:2;
    }
    .barrel .tip{ position:absolute; top:-14px; left:50%; width:2px; height:2px; }
    .flash{
        position:absolute; top:-26px; left:50%; width:36px; height:36px; border-radius:50%;
        transform:translateX(-50%) scale(.4); opacity:0; pointer-events:none;
        background:radial-gradient(circle,#fffbe0 0%,#ffd166 35%,#ff8a00 58%,rgba(255,120,0,0) 74%);
    }
    .gun.firing .flash{ animation:flashPulse .22s ease-out; }
    @keyframes flashPulse{
        0%{ opacity:1; transform:translateX(-50%) scale(.45); }
        55%{ opacity:1; transform:translateX(-50%) scale(1.5); }
        100%{ opacity:0; transform:translateX(-50%) scale(1.9); }
    }
    .gun.firing .barrel{ transform:translateY(7px); }
    .breech{
        position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
        width:74px; height:26px; border-radius:7px;
        background:linear-gradient(180deg,#6d7a5f,#3b4536 55%,#2a3226);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 3px 8px rgba(0,0,0,.35);
        z-index:1;
    }
    .gun-body{ position:relative; width:100%; display:flex; flex-direction:column; align-items:center; z-index:2; }
    /* 防盾 */
    .shield{
        position:relative; width:92%; height:22px; margin-top:2px;
        border-radius:9px 9px 3px 3px;
        background:linear-gradient(180deg,#8b997a,#5d6a4d 55%,#46503a);
        box-shadow:inset 0 2px 0 rgba(255,255,255,.22), 0 4px 10px rgba(0,0,0,.28);
    }
    .shield::before{
        content:''; position:absolute; inset:0; border-radius:inherit; z-index:0;
        background:
            radial-gradient(20px 11px at 20% 60%, rgba(60,70,48,.75), transparent 72%),
            radial-gradient(24px 13px at 58% 42%, rgba(60,70,48,.55), transparent 72%),
            radial-gradient(17px 10px at 84% 66%, rgba(60,70,48,.7), transparent 72%);
    }
    .shield::after{
        content:''; position:absolute; left:8px; right:8px; top:5px; height:5px;
        background-image:radial-gradient(circle,#2c3427 1.5px, transparent 1.8px);
        background-size:13px 5px;
        opacity:.75; z-index:1;
    }
    /* 炮座 */
    .turret{
        width:100%; height:16px; margin-top:-3px;
        border-radius:3px 3px 10px 10px;
        background:linear-gradient(180deg,#4d5842,#333c2c);
        box-shadow:0 6px 14px rgba(0,0,0,.28);
    }
    /* 火控台（输入框所在） */
    .console{
        width:100%; margin-top:-2px;
        background:linear-gradient(180deg,#3a4331 0%, #262d1f 60%, #1b2016 100%);
        border-radius:6px 6px 16px 16px;
        padding:10px; position:relative; z-index:2;
        box-shadow:0 12px 28px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.14);
    }
    .console::before{
        content:''; position:absolute; left:10px; right:10px; top:1px; height:3px;
        border-radius:2px; background:repeating-linear-gradient(90deg,#7d8a6c 0 8px, #55614a 8px 16px);
        opacity:.7;
    }
    .console input{
        width:100%; border:none; outline:none;
        padding:11px 14px; font-size:23px; text-align:center;
        border-radius:8px; background:rgba(255,255,255,.96);
        color:#1d2b3a; font-family:inherit; font-weight:700; letter-spacing:1px;
        box-shadow:inset 0 2px 7px rgba(0,0,0,.16);
    }
    .console input::placeholder{ color:#a9b6c4;font-weight:500;letter-spacing:0; }
    .console input.bad{ animation:bad .35s; }
    @keyframes bad{
        0%,100%{ transform:translateX(0) }
        20%{ transform:translateX(-8px) } 40%{ transform:translateX(8px) }
        60%{ transform:translateX(-5px) } 80%{ transform:translateX(5px) }
    }
    /* 沙袋掩体 */
    .sandbags{
        position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
        width:104%; display:flex; gap:5px; justify-content:space-between; z-index:1;
    }
    .sandbags i{
        flex:1; height:20px; border-radius:11px 11px 9px 9px;
        background:linear-gradient(180deg,#e0cba4 0%,#c4ab82 55%,#a58c63 100%);
        box-shadow:inset 0 -3px 5px rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.4), 0 2px 5px rgba(0,0,0,.22);
        border:1px solid rgba(120,98,66,.45);
    }
    .sandbags i:nth-child(even){ transform:translateY(5px); }
    .gun::after{
        content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
        width:110%; height:14px; border-radius:50%;
        background:radial-gradient(ellipse at center, rgba(0,0,0,.22), rgba(0,0,0,0) 70%);
        z-index:0;
    }

    /* ---------- 麦克风指示 ---------- */
    .mic{
        position:absolute; left:14px; top:12px; z-index:60;
        display:none; align-items:center; gap:8px;
        background:rgba(20,30,44,.82); color:#fff;
        padding:8px 14px; border-radius:99px; font-size:13px; font-weight:600;
        backdrop-filter:blur(4px);
    }
    .mic.on{ display:flex; }
    .mic.warn{ cursor:pointer; }
    .mic.warn:hover{ background:rgba(75,55,18,.9); }
    .mic .heard{
        max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        color:#bae6fd; font-weight:500; padding-left:4px; border-left:1px solid rgba(255,255,255,.25);
    }
    .mic .heard:empty{ display:none; }
    .mic .dot{ width:9px;height:9px;border-radius:50%;background:#ff5a5f;animation:micPulse 1.1s infinite; flex:0 0 auto; }
    .mic.warn .dot{ background:#ffb020; animation:none; }
    @keyframes micPulse{ 0%,100%{ opacity:1; transform:scale(1) } 50%{ opacity:.35; transform:scale(.75) } }
    .mic .bars{ display:flex; align-items:flex-end; gap:2px; height:14px; }
    .mic .bars i{ width:3px; background:#7dd3fc; border-radius:2px; animation:bar 1s ease-in-out infinite; }
    .mic .bars i:nth-child(1){ height:5px; animation-delay:0s }
    .mic .bars i:nth-child(2){ height:11px; animation-delay:.15s }
    .mic .bars i:nth-child(3){ height:7px; animation-delay:.3s }
    .mic .bars i:nth-child(4){ height:13px; animation-delay:.45s }
    @keyframes bar{ 0%,100%{ transform:scaleY(.4) } 50%{ transform:scaleY(1) } }

    /* ---------- 语音自检弹窗 ---------- */
    .vmodal{
        position:fixed; inset:0; z-index:400; display:none;
        align-items:center; justify-content:center;
        background:rgba(16,28,44,.6); backdrop-filter:blur(6px);
        padding:16px; font-family:inherit;
    }
    .vmodal.on{ display:flex; }
    .vbox{
        background:#fff; border-radius:20px; padding:20px 22px;
        width:100%; max-width:560px; box-shadow:0 24px 60px rgba(0,0,0,.35);
        animation:panelIn .24s cubic-bezier(.2,.9,.3,1.2);
    }
    .vhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .vhead h3{ margin:0; font-size:19px; color:var(--ink); }
    .vclose{ border:none; background:transparent; font-size:20px; cursor:pointer; color:var(--muted); line-height:1; }
    .vsteps{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
    .vrow{
        display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--ink);
        background:#f4f8fd; border-radius:12px; padding:9px 12px; line-height:1.5;
    }
    .vrow .k{ font-weight:700; white-space:nowrap; }
    .vrow .v{ color:var(--muted); flex:1; }
    .vrow.ok{ background:#eafaf1; } .vrow.ok .k{ color:var(--green); }
    .vrow.bad{ background:#fff0f0; } .vrow.bad .k{ color:var(--red); }
    .vrow.wait{ background:#fff8e8; } .vrow.wait .k{ color:#c9820a; }
    .vmeter{ height:10px; background:#e8eef7; border-radius:99px; overflow:hidden; margin-bottom:12px; }
    .vmeter i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#12c2e9,#2f7ef7); transition:width .12s linear; }
    .vadvice{
        font-size:13px; color:var(--ink); background:#f4f8fd;
        border-left:3px solid var(--brand); border-radius:10px; padding:10px 12px;
        margin-bottom:14px; line-height:1.7;
    }
    .vbtns{ display:flex; gap:10px; flex-wrap:wrap; }
    .vbtns .btn{ flex:1; min-width:120px; }
    .vcards{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .vcards .btn{ flex:1; min-width:130px; }

    /* ---------- 高射炮指挥官（卡通人物） ----------
       布局：靠舞台右下方站位，小人缩小，下方「指挥官 + 玩家名字」铭牌竖排，
       整体用 flex 纵向排布，避免绝对定位压住火控台输入框 */
    .cmd-side{
        position:absolute; bottom:6px; z-index:45;
        /* 左边缘正好贴在高射炮右边缘（炮宽 = min(420px,88%)），保证铭牌永不压住输入框 */
        left:calc(50% + min(210px, 44%));
        right:10px;
        display:flex; align-items:flex-end; gap:10px;
        pointer-events:none; user-select:none;
    }
    .cmd{
        position:relative;
        flex:0 0 auto; width:min(150px, 42vw);
        display:flex; flex-direction:column; align-items:center; gap:2px;
    }
    .cmd-svg{ width:74px; height:auto; display:block; animation:cmdBob 2.8s ease-in-out infinite; filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
    @keyframes cmdBob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-5px) } }
    .cmd-arm{ transform-origin:80px 96px; transition:transform .26s cubic-bezier(.2,.9,.3,1.2); }
    .cmd.fire .cmd-arm{ transform:rotate(-32deg); }
    .cmd.fire .cmd-svg{ animation:cmdKick .3s ease-out; }
    @keyframes cmdKick{ 0%{transform:translateY(0)} 45%{transform:translateY(-7px)} 100%{transform:translateY(0)} }
    .cmd.cheer .cmd-svg{ animation:cmdJump .75s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes cmdJump{ 0%{transform:translateY(0)} 32%{transform:translateY(-24px) scale(1.05)} 62%{transform:translateY(0)} }
    .cmd.sad .cmd-svg{ animation:cmdSad 1.5s ease-in-out infinite; }
    @keyframes cmdSad{ 0%,100%{ transform:translateY(3px) rotate(-2.5deg) } 50%{ transform:translateY(5px) rotate(2.5deg) } }
    .cmd-eye{ animation:cmdBlink 4.4s infinite; }
    @keyframes cmdBlink{ 0%,93%,100%{ transform:scaleY(1) } 96%{ transform:scaleY(.12) } }

    /* ---------- 表情切换 ----------
       默认只显示微笑嘴；炸弹在指挥官身旁爆炸时（JS 会给 #cmd 加 .crying），
       才切换成皱眉 + 泪水的哭脸，其他时间始终保持笑脸。 */
    .cmd-sad-face{ display:none; }
    .cmd.crying .cmd-smile{ display:none; }
    .cmd.crying .cmd-sad-face{ display:inline; }
    /* 哭脸时泪水轻轻闪烁，让「在哭」更明显 */
    .cmd.crying .cmd-tears{ animation:cmdTear 1.05s ease-in-out infinite; }
    @keyframes cmdTear{ 0%,100%{ opacity:.62 } 50%{ opacity:1 } }
    .cmd-bubble{
        position:absolute; right:118px; bottom:76px; transform:translateY(8px);
        background:#fff; color:var(--ink); font-size:12px; font-weight:700;
        padding:6px 11px; border-radius:12px; white-space:nowrap;
        box-shadow:0 8px 18px rgba(0,0,0,.22); opacity:0; transition:.22s; z-index:2;
    }
    .cmd-bubble::after{
        content:''; position:absolute; right:-5px; bottom:9px; width:11px; height:11px;
        background:#fff; transform:rotate(45deg); border-radius:2px;
    }
    .cmd-bubble.on{ opacity:1; transform:translateY(0); }
    /* 「指挥官」职务标签 */
    .cmd-name{
        background:linear-gradient(180deg,#2a3a52,#18242f);
        color:#ffd166; font-size:19px; font-weight:900; letter-spacing:3px;
        padding:2px 14px; border-radius:99px; white-space:nowrap;
        border:2px solid rgba(255,176,32,.6);
        box-shadow:0 5px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14);
        text-shadow:0 1px 3px rgba(0,0,0,.6);
    }
    /* 玩家名字（放大） */
    .cmd-sub{
        background:linear-gradient(180deg,#2f7ef7,#12c2e9);
        color:#fff; font-size:22px; font-weight:900; letter-spacing:1px;
        padding:2px 16px; border-radius:99px; white-space:nowrap;
        max-width:210px; overflow:hidden; text-overflow:ellipsis;
        border:2px solid rgba(255,255,255,.55);
        box-shadow:0 5px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35);
        text-shadow:0 1px 3px rgba(0,0,0,.45);
    }
    @media (max-width:900px){ .cmd-side{ display:none; } }

    /* ---------- 浮字 ---------- */
    .pop{
        position:absolute;z-index:35;font-weight:800;font-size:22px;
        color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4);
        pointer-events:none;animation:popUp 1s ease-out forwards;
    }
    @keyframes popUp{
        0%{ transform:translate(-50%,0) scale(.7); opacity:0 }
        25%{ transform:translate(-50%,-16px) scale(1.15); opacity:1 }
        100%{ transform:translate(-50%,-70px) scale(1); opacity:0 }
    }
    .toast{
        position:absolute;left:50%;top:14px;transform:translateX(-50%);
        z-index:60;background:rgba(34,48,63,.9);color:#fff;
        padding:8px 18px;border-radius:99px;font-size:15px;font-weight:700;
        animation:toastIn 1.6s ease forwards;pointer-events:none;
    }
    @keyframes toastIn{
        0%{ opacity:0;transform:translate(-50%,-14px) }
        15%,70%{ opacity:1;transform:translate(-50%,0) }
        100%{ opacity:0;transform:translate(-50%,-10px) }
    }

    /* ---------- 遮罩 ---------- */
    .overlay{
        position:absolute;inset:0;z-index:80;
        display:flex; overflow:auto; overscroll-behavior:contain;
        /* safe center：面板比容器高时改为顶部对齐，保证顶部内容可见且可滚动到底 */
        align-items:safe center; justify-content:safe center;
        background:rgba(16,28,44,.55);
        backdrop-filter:blur(6px);
        padding:14px;
    }
    .overlay.hide{ display:none; }
    .panel{
        margin:auto;
        background:#fff;border-radius:22px;padding:22px 26px;
        box-shadow:0 24px 60px rgba(0,0,0,.35);
        text-align:center;max-width:560px;width:100%;
        animation:panelIn .28s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes panelIn{ from{ transform:scale(.9) translateY(10px); opacity:0 } to{ transform:none;opacity:1 } }
    .panel.wide{ max-width:720px; padding:16px 20px; }
    /* 结算面板内容较多时，面板自身可滚动 */
    .panel.wide{ max-height:100%; overflow:auto; }
    .panel h2{ margin:0 0 6px; font-size:26px; }
    .panel .lead{ color:var(--muted);font-size:15px;margin-bottom:4px;line-height:1.7; }
    .btn-start{
        display:block;width:100%;border:none;cursor:pointer;font-family:inherit;
        font-size:24px;font-weight:800;letter-spacing:3px;color:#fff;
        padding:16px 20px;border-radius:18px;margin-top:4px;
        background:linear-gradient(135deg,#2f7ef7,#12c2e9 55%,#25d0a0);
        animation:ctaGlow 2.4s ease-in-out infinite;
        transition:transform .15s;
    }
    .btn-start:hover{ transform:translateY(-2px) scale(1.012); }
    .btn-start:active{ transform:scale(.98); }
    @keyframes ctaGlow{
        0%,100%{ box-shadow:0 12px 26px rgba(47,126,247,.42); }
        50%{ box-shadow:0 12px 38px rgba(18,194,233,.75); }
    }
    .btn-start.voice{ background:linear-gradient(135deg,#7c4dff,#e040fb 60%,#ff5a8a); }
    .seg{ display:flex;gap:6px;background:#eef3fa;border-radius:99px;padding:5px;margin:14px 0 12px; }
    .seg button{
        flex:1;border:none;background:transparent;cursor:pointer;font-family:inherit;
        padding:9px 4px;border-radius:99px;font-size:14px;font-weight:700;
        color:var(--muted);transition:.18s;white-space:nowrap;
    }
    .seg button.on{ background:#fff;color:var(--brand);box-shadow:0 4px 12px rgba(31,52,84,.14); }
    .mini{ font-size:13px;color:var(--muted);margin-top:12px;line-height:1.9; }
    .mini b{ color:var(--ink); }
    .stats{ display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px; }
    .panel.wide .stats{ grid-template-columns:repeat(7,1fr);gap:7px;margin:10px 0 12px; }
    .panel.wide .stat{ padding:8px 5px; }
    .panel.wide .stat .sv{ font-size:17px; }
    .panel.wide .stat .sk{ font-size:11px; }
    .stat{ background:#f5f8fc;border-radius:14px;padding:10px 8px; }
    .stat .sv{ font-size:22px;font-weight:800;color:var(--brand); }
    .stat .sk{ font-size:12px;color:var(--muted);margin-top:2px; }
    .actions{ display:flex;gap:10px;justify-content:center;flex-wrap:wrap; }
    .missed{
        text-align:left;background:#fff7ed;border:1px solid #ffe0b2;border-radius:14px;
        padding:10px 14px;font-size:14px;color:#8a5a20;margin-bottom:16px;line-height:1.9;
        max-height:110px;overflow:auto;
    }
    .note{
        text-align:left;border-radius:14px;padding:12px 16px;font-size:14px;
        line-height:1.85;margin:12px 0;
    }
    .note.ok{ background:#eef7ff;color:#2a5b8a;border:1px solid #cfe6ff; }
    .note.warn{ background:#fff7ed;color:#8a5a20;border:1px solid #ffe0b2; }

    /* ---------- 词库抽屉 ---------- */
    .drawer{
        position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);
        background:#fff;box-shadow:-12px 0 40px rgba(31,52,84,.2);
        transform:translateX(105%);transition:transform .28s ease;
        z-index:200;padding:18px;overflow:auto;
    }
    .drawer.open{ transform:none; }
    .drawer h3{ margin:0 0 4px; }
    .drawer .tip{ font-size:12px;color:var(--muted);margin-bottom:12px; }
    .wrow{
        display:flex;align-items:center;justify-content:space-between;
        padding:9px 12px;border-radius:12px;margin-bottom:6px;background:#f6f9fd;
    }
    .wrow .w{ font-size:19px;font-weight:700; }
    .wrow .p{ font-size:12px;color:var(--brand); }
    .wrow .mark{ font-size:16px;color:#cfd8e3; }
    .wrow.done .mark{ color:var(--green); }

    kbd{
        background:#fff;border:1px solid #d7e0ea;border-bottom-width:2px;
        border-radius:6px;padding:1px 6px;font-size:12px;font-family:inherit;color:#43566b;
    }
    @media (max-width:1400px){
        .layout{ grid-template-columns:198px minmax(0,1fr); gap:11px; }
    }
    @media (max-width:1080px){
        .layout{ grid-template-columns:minmax(0,1fr); }
        .rail{ flex-direction:row; flex-wrap:wrap; }
        .rail > .rail-card{ flex:1 1 240px; }
    }
    @media (max-width:760px){
        .chip .v{ font-size:18px; }
        .brand h1{ font-size:21px; }
        .gun{ width:min(360px,94%); }
        .stage{ height:clamp(430px, 62vh, 560px); }
    }
/* 界面微调：保留原开始菜单，统一间距，并适配较矮的窗口。 */
html, body { height:auto; min-height:100%; }
body { min-height:100vh; min-height:100svh; padding:16px; overflow-x:hidden; }
.app { max-width:1440px; padding:18px; gap:16px; border-radius:24px; }
.title-bar { min-height:68px; flex-shrink:0; }
.brand h1 { line-height:1.25; }
.who { margin-top:4px; padding:2px 10px; font-size:11px; line-height:1.4; }
.brand .logo { box-shadow:0 5px 14px rgba(47,126,247,.22); }
.layout { grid-template-columns:200px minmax(0,1fr); gap:16px; align-items:stretch; }
.rail { gap:10px; }
.rail-card { padding:10px; border-color:#e5edf6; border-radius:16px; box-shadow:0 3px 12px rgba(31,52,84,.045); }
.rail-h { margin-bottom:8px; }
.hud { gap:6px; }
.rail .chip { padding:5px 8px; min-height:31px; background:#f4f8fd; border:0; box-shadow:none; }
.rail .chip .v { font-size:16px; font-variant-numeric:tabular-nums; }
.rail .tools { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.rail .tools .btn { width:100%; min-height:36px; padding:7px 5px; font-size:13px; border-radius:10px; }
.rail .tools #btnHome { grid-column:1 / -1; }
.rail .hint { font-size:12px; line-height:1.7; }
.rail .kbd-row { margin-top:6px; font-size:11px; line-height:1.8; }

/* 漏词炸弹位于独立舞台层，小窗口也能看到。 */
.missbombs { position:absolute; inset:0; display:block; max-width:none; z-index:48; pointer-events:none; }
.missbomb { position:absolute; bottom:62px; width:32px; height:38px;
    animation:bombDrop .72s cubic-bezier(.42,0,.9,.65) both; }
.missbomb .bomb-word { position:absolute; bottom:47px; left:50%; transform:translateX(-50%);
    white-space:nowrap; background:#fff4e7; color:#8e341b; border:1px solid #ffb26e;
    border-radius:8px; padding:4px 8px; font-size:14px; font-weight:700;
    box-shadow:0 3px 8px rgba(0,0,0,.15); }
@keyframes bombDrop {
    0% { transform:translateY(var(--drop-height,-260px)) rotate(-12deg); opacity:0; }
    15% { opacity:1; }
    100% { transform:translateY(0) rotate(0); opacity:1; }
}
.missbomb.detonated { animation:bombClear .9s linear both; }
.missbomb.detonated::before, .missbomb.detonated::after,
.missbomb.detonated > i, .missbomb.detonated .bomb-word { display:none; }
.bomb-fire, .bomb-ring, .bomb-smoke, .bomb-spark { position:absolute; display:none; left:50%; bottom:0; }
.detonated .bomb-fire { display:block; width:110px; height:110px; margin-left:-55px; margin-bottom:-48px;

    animation:groundFire .65s ease-out both; }
.detonated .bomb-ring { display:block; width:120px; height:40px; margin-left:-60px; margin-bottom:-17px;

.detonated .bomb-smoke { display:block; width:78px; height:68px; margin-left:-39px; margin-bottom:-12px;

    animation:groundSmoke .9s ease-out both; }
.detonated .bomb-spark { display:block; width:7px; height:7px; margin-left:-3px; border-radius:50%;
    background:#ffe49a; box-shadow:0 0 7px #ff8a1c; animation:groundSpark .65s ease-out both; }
@keyframes groundFire { from{transform:scale(.15);opacity:1} 30%{opacity:1} to{transform:scale(1.45);opacity:0} }

@keyframes bombClear { 0%,85%{opacity:1} 100%{opacity:0} }

/* =========================================================
   拼音判定：声母 + 韵母 + 声调
   —— 语音识别时，只要读音和声调一致，同音字也算命中
   （例：识别为“河市”，应能命中“合适 hé shì”）
   ========================================================= */
const PY_TONE = {
    'ā':'a1','á':'a2','ǎ':'a3','à':'a4',
    'ē':'e1','é':'e2','ě':'e3','è':'e4',
    'ī':'i1','í':'i2','ǐ':'i3','ì':'i4',
    'ō':'o1','ó':'o2','ǒ':'o3','ò':'o4',
    'ū':'u1','ú':'u2','ǔ':'u3','ù':'u4',
    'ǖ':'v1','ǘ':'v2','ǚ':'v3','ǜ':'v4','ü':'v'
};
/* 常见同音字 → 音节（声母+韵母+声调） */
const PY_TABLE = (() => {
    const map = {};
    const add = (chars, syl) => { for (const c of chars) map[c] = syl; };
    add("小晓筱", "xiao3");

    add("要药藥耀", "yao4");
    add("定订訂钉錠", "ding4");
    add("付复復副富负負父", "fu4");

/* 把一个带声调的拼音音节规范成 "声母韵母+声调数字"，如 chū → chu1 */
function pyCanon(syl){
    let out = '', tone = '';
    for (const ch of String(syl)){
        const m = PY_TONE[ch];
        if (m){ out += m[0]; tone = m[1] || ''; }
        else out += ch;
    }
    return out.toLowerCase() + (tone || '0');
}
function pySeqOf(pinyin){
    return String(pinyin).trim().split(/\s+/).filter(Boolean).map(pyCanon);
}
/* 儿化音：目标里写作 tiānr，允许当作 tiān */
function pyVariants(seq){
    const alt = seq.map(s => {
        const tone = s.slice(-1), base = s.slice(0, -1);
        if (base.length > 2 && base.endsWith('r')) return base.slice(0, -1) + tone;
        return s;
    });
    const out = [seq];
    if (alt.join('|') !== seq.join('|')) out.push(alt);
    return out;
}
/* 汉字串 → 音节序列（无法识别的字跳过） */
function hanziSyllables(text){
    const out = [];
    for (const ch of String(text)){
        if (!/[\u4e00-\u9fff]/.test(ch)) continue;
        const s = PY_TABLE[ch];
        if (s) out.push(s);
    }
    return out.length ? out : null;
}
/* 儿化：识别出“儿”时可与前一音节合并 */
function mergeErhua(seq){
    const out = seq.slice();
    const last = out[out.length - 1];
    if (out.length > 1 && last && last.slice(0, -1) === 'er') out.pop();
    return out;
}
function sylEq(a, b){
    if (a === b) return true;
    const ba = a.slice(0, -1), bb = b.slice(0, -1);
    if (ba !== bb) return false;
    const ta = a.slice(-1), tb = b.slice(-1);
    if (ta === tb) return true;
    if (ta === '0' || tb === '0') return true;              // 未标声调视为通配
    if ((ba === 'yi' || ba === 'bu') && '1234'.includes(ta) && '1234'.includes(tb)) return true; // 一/不 变调
    return false;
}
function seqContains(hay, needle){
    if (!needle.length || needle.length > hay.length) return false;
    for (let i = 0; i + needle.length <= hay.length; i++){
        let ok = true;
        for (let j = 0; j < needle.length; j++){
            if (!sylEq(hay[i + j], needle[j])){ ok = false; break; }
        }
        if (ok) return true;
    }
    return false;
}
/* 语音命中判定：汉字完全一致 / 包含该词 / 读音与声调一致 */
function pyMatch(plane, text){
    const rec = hanziSyllables(text);
    if (rec){
        const recVars = [rec];
        const merged = mergeErhua(rec);
        if (merged.join('|') !== rec.join('|')) recVars.push(merged);
        for (const rv of recVars){
            for (const tv of plane.word.pyVars){
                if (seqContains(rv, tv)) return true;
            }
        }
        return false;
    }
    // 识别结果直接是拉丁字母（说了拼音）
    const flat = norm(text);
    if (flat && /^[a-z0-9]+$/.test(flat)) return plane.word.pyFlat === flat;
    return false;
}
WORDS.forEach(w => {
    w.py = pySeqOf(w.pinyin);
    w.pyVars = pyVariants(w.py);
    w.pyFlat = w.py.map(s => s.replace(/[0-9]/g, '')).join('');
});

function norm(s){
    return (s || '')
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[\s'’·\-]/g, '')
        .replace(/[^a-z0-9\u4e00-\u9fff]/g, '');
}

    const py = norm(w.pinyin);

function shuffle(a){
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
}

let actx = null, muted = localStorage.getItem('kongxizhan_muted') === '1';
function AC(){
    if (!actx){
        const C = window.AudioContext || window.webkitAudioContext;
        if (C) actx = new C();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
}
function tone(freq, dur, type='sine', vol=.14, slideTo=null, delay=0){
    if (muted) return;
    const a = AC(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + .05);
}
function noise(dur=.3, vol=.2, freq=900, delay=0){
    if (muted) return;
    const a = AC(); if (!a) return;
    const t0 = a.currentTime + delay;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t0);
}

function explode(x, y, big){
    const n = big ? 34 : 22;
    for (let i = 0; i < n; i++){
        const a = Math.random() * Math.PI * 2, sp = rand(60, big ? 320 : 230);
        parts.push({
            x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
            life:0, max:rand(.45,.95),
            c:['#ffd166','#ff9f1c','#ff5714','#ffffff','#ffd6a5'][Math.floor(Math.random()*5)],
            r:rand(2, big ? 7 : 5)
        });
    }
    rings.push({ x, y, r:4, max:big ? 92 : 62, life:0, dur:.45 });
    for (let i = 0; i < 6; i++){
        parts.push({ x, y, vx:rand(-40,40), vy:rand(-70,-20), life:0, max:rand(.7,1.3),
            c:'rgba(120,120,120,.55)', r:rand(8,16) });
    }
}
function loop(ts){
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (ts - lastT) / 1000 || 0);
    lastT = ts;
    const r = stage.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);

    if (!S.paused){
        checkSpeakReady();
        shells = shells.filter(s => {
            s.t += dt;
            const p = clamp(s.t / s.dur, 0, 1);
            s.x = s.sx + (s.tx - s.sx) * p;
            s.y = s.sy + (s.ty - s.sy) * p;
            if (p >= 1){ if (s.onHit) s.onHit(); return false; }
            return true;
        });
        parts = parts.filter(p => {
            p.life += dt;
            if (p.life >= p.max) return false;
            p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.vx *= .985;
            return true;
        });
        rings = rings.filter(g => { g.life += dt; return g.life < g.dur; });
    }

    shells.forEach(s => {
        ctx.strokeStyle = 'rgba(255,180,60,.75)';
        ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(s.sx, s.sy); ctx.lineTo(s.x, s.y); ctx.stroke();
        ctx.save();
        ctx.shadowColor = '#ffb020'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#fff3c4';
        ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    });
    rings.forEach(g => {
        const p = g.life / g.dur;
        ctx.strokeStyle = 'rgba(255,' + Math.floor(200 - 120 * p) + ',80,' + (1 - p).toFixed(2) + ')';
        ctx.lineWidth = 6 * (1 - p) + 1;
        ctx.beginPath(); ctx.arc(g.x, g.y, g.r + (g.max - g.r) * p, 0, Math.PI * 2); ctx.stroke();
    });
    parts.forEach(p => {
        const a = 1 - p.life / p.max;
        ctx.globalAlpha = Math.max(0, a);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.8), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
}

/* =========================================================
   错因归因：把"打错 / 说错"落到具体某个词上
   —— 打字：与场上词的拼音/汉字做编辑距离比对

   ========================================================= */
function levDist(a, b){
    a = a || ''; b = b || '';
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++){
        cur[0] = i;
        for (let j = 1; j <= n; j++){
            cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        const tmp = prev; prev = cur; cur = tmp;
    }
    return prev[n];
}

    const out = [];
    for (const ch of String(text)){
        if (!/[\u4e00-\u9fff]/.test(ch)) continue;
        out.push(PY_TABLE[ch] || ATTR_PY_EXTRA[ch] || null);
    }
    return out.length ? out : null;
}
/* 打字错误 → 归因到最接近的场上目标词
   相似度 = 1 - 编辑距离/长度；取最高分者，且必须明显优于次优者（否则视为歧义，不归因） */
function attrTypeError(raw){
    const v = norm(raw);
    if (!v || v.length < 2) return null;
    const list = S.active.filter(p => !p.doomed);
    if (!list.length) return null;
    let best = null, bestSc = 0, secondSc = 0;
    for (const p of list){
        let sc = 0;
        for (const k of p.keys){
            const d = levDist(v, k);
            const s2 = 1 - d / Math.max(v.length, k.length, 1);
            if (s2 > sc) sc = s2;
        }
        if (sc > bestSc){ secondSc = bestSc; bestSc = sc; best = p; }
        else if (sc > secondSc) secondSc = sc;
    }
    if (!best || bestSc < 0.55) return null;          // 离所有目标词都很远 → 不归因
    if (secondSc >= bestSc - 0.06) return null;        // 两个词同样接近 → 无法判断，不归因
    logTypeErr(best.word.word, String(raw).trim());
    return best;
}
/* 音节拆解：声母 / 韵母 / 声调，用于比较"读得像不像" */
const PY_INITIALS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
function sylParts(syl){
    const str = String(syl || '');
    const tone = str.slice(-1);
    const base = tone.length && '0123456789'.indexOf(tone) >= 0 ? str.slice(0, -1) : str;
    let ini = '', fin = base;
    for (const i of PY_INITIALS){
        if (base.indexOf(i) === 0){ ini = i; fin = base.slice(i.length); break; }
    }
    return { ini: ini, fin: fin, tone: tone };
}
/* 两个音节的接近程度：0 ~ 1 */
function sylSim(a, b){
    if (!a || !b) return 0;
    if (a === b) return 1;
    const pa = sylParts(a), pb = sylParts(b);
    if (pa.ini === pb.ini && pa.fin === pb.fin) return 0.8;   // 声母韵母相同，声调不同
    if (pa.fin && pa.fin === pb.fin) return 0.5;             // 韵母相同（前后鼻音等）
    if (pa.ini && pa.ini === pb.ini) return 0.45;            // 声母相同
    return 0;
}
/* 语音错误 → 归因到读音最接近的场上目标词 */
function voiceSim(word, rec, raw){
    let best = 0;
    if (rec && rec.length){
        for (const tv of word.pyVars){
            // 每个目标音节独立取"最像它"的识别音节，避免位置错位导致漏判
            let h = 0;
            for (let i = 0; i < tv.length; i++){
                let m = 0;
                for (let j = 0; j < rec.length; j++){
                    const sc = sylSim(rec[j], tv[i]);
                    if (sc > m) m = sc;
                }
                h += m;
            }
            const sc = tv.length ? h / tv.length : 0;
            if (sc > best) best = sc;
        }
    }
    const raw2 = norm(raw);
    if (raw2 && /[\u4e00-\u9fff]/.test(raw2)){
        const w = norm(word.word);
        const d = levDist(raw2, w);
        const sc = 1 - d / Math.max(raw2.length, w.length, 1);
        if (sc > best) best = sc;
    }
    if (raw2 && /^[a-z0-9]+$/.test(raw2)){
        const d = levDist(raw2, word.pyFlat);
        const sc = 1 - d / Math.max(raw2.length, word.pyFlat.length, 1);
        if (sc > best) best = sc;
    }
    return best;
}
function attrVoiceError(raw){
    const list = S.active.filter(p => !p.doomed);
    if (!list.length) return null;
    const rec = attrSyllables(raw);
    let best = null, bestSc = 0, secondSc = 0;
    for (const p of list){
        const sc = voiceSim(p.word, rec, raw);
        if (sc > bestSc){ secondSc = bestSc; bestSc = sc; best = p; }
        else if (sc > secondSc) secondSc = sc;
    }
    if (!best || bestSc < 0.5) return null;               // 读音对不上 → 不归因
    if (secondSc >= bestSc - 0.06) return null;           // 多个词读音同样接近 → 不归因
    logVoiceErr(best.word.word, String(raw).trim());
    return best;
}

/* =========================================================
   语音识别（最终关）
   ========================================================= */
let recog = null, recogActive = false, recogFail = false;
let micPromptOpen = false, micDecisionCallback = null;
let lastHeard = '', micError = '', recogEverStarted = false, micRetryTimer = null;
let voiceSkip = false;   // 本轮选择键盘模式，语音可随时重开
function SR(){ return window.SpeechRecognition || window.webkitSpeechRecognition; }
function speechSupported(){ return !!SR(); }
function voiceUsable(){ return speechSupported() && !recogFail; }

function initSpeech(){
    if (recog) return;
    const Ctor = SR(); if (!Ctor) return;
    recog = new Ctor();
    recog.lang = 'zh-CN';
    recog.continuous = true;
    recog.interimResults = true;
    recog.maxAlternatives = 3;

    recog.onresult = ev => {
        let heard = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++){
            const res = ev.results[i];
            for (let k = 0; k < res.length; k++){
                const txt = res[k] && res[k].transcript;
                if (!txt) continue;
                if (!heard) heard = txt.trim();
                checkSpeech(txt);
            }
        }
        if (heard){
            lastHeard = heard;
            micError = '';
            updateMic();
        }
    };
    recog.onstart = () => {
        recogEverStarted = true;
        micPromptOpen = false;
        micError = '';
        updateMic();
        finishMicDecision();
    };
    recog.onerror = ev => {
        const e = ev.error;
        micPromptOpen = false;
        if (e === 'not-allowed' || e === 'service-not-allowed'){
            recogFail = true; recogActive = false; micError = 'denied';
            updateMic(); toast(t('micDenied'));
        } else if (e === 'audio-capture'){
            recogFail = true; recogActive = false; micError = 'capture';
            updateMic(); toast(t('micCapture'));
        } else if (e === 'network'){
            // network 往往是识别服务暂时不可达，不应永久禁用；保留重试能力。
            recogActive = false; micError = 'network';
            updateMic(); toast(t('micNeedHttps'));
        } else {
            updateMic();
        }
        // 无论允许、拒绝还是识别出错，都不能把玩家卡在关卡入口。
        finishMicDecision();
    };
    recog.onend = () => {
        micPromptOpen = false;
        finishMicDecision();
        if (recogActive && S.running && !S.paused && isVoiceRound()){
            clearTimeout(micRetryTimer);
            micRetryTimer = setTimeout(() => {
                if (recogActive && S.running && !S.paused && isVoiceRound()) startListening();
            }, 250);
        }
    };
}
function finishMicDecision(){
    const callback = micDecisionCallback;
    micDecisionCallback = null;
    if (callback) callback();
}
function startListening(onReady){
    if (!voiceUsable() || voiceSkip){
        updateMic();
        if (onReady) onReady();
        return;
    }
    initSpeech();
    recogActive = true;
    micError = '';
    if (onReady) micDecisionCallback = onReady;
    // 只有首次启动需要等待授权；后续自动重启不显示“等待授权”。
    micPromptOpen = !recogEverStarted;
    try { recog.start(); }
    catch (e) {
        // 已处于运行状态时不需要再次等待授权。
        micPromptOpen = false;
        finishMicDecision();
    }
    updateMic();
}
function stopListening(){
    recogActive = false;
    micPromptOpen = false;
    micDecisionCallback = null;
    micError = '';
    lastHeard = '';
    clearTimeout(micRetryTimer);
    if (recog){ try { recog.stop(); } catch (e) {} }
    updateMic();
}
function updateMic(){
    const show = S.running && !S.paused && isVoiceRound();
    const waiting = micPromptOpen && voiceUsable();
    let label = t('micOff');
    if (voiceSkip) label = t('micSkip');
    else if (voiceUsable()){
        if (waiting) label = t('micWaiting');
        else if (micError === 'network') label = t('micNeedHttps');
        else label = t('micListening');
    }
    micEl.classList.toggle('on', !!show);
    micEl.classList.toggle('warn', !voiceUsable() || waiting || !!micError || voiceSkip);
    $('micText').textContent = label;
    $('micHeard').textContent = lastHeard ? tf('micHeard', { w:lastHeard }) : '';
    micEl.title = micError === 'network' ? t('micRetryHint') : '';
    micEl.querySelector('.bars').style.display = voiceUsable() && !waiting && !micError ? 'flex' : 'none';
}
function checkSpeech(text){
    if (!S.running || S.paused || !isVoiceRound()) return;
    const v = norm(text);
    if (!v) return;
    const list = S.active.filter(p => !p.doomed);
    if (!list.length) return;
    let hit = list.find(p => norm(p.word.word) === v);
    if (!hit) hit = list.find(p => norm(p.word.word).length >= 2 && v.indexOf(norm(p.word.word)) !== -1);
    // 读音一致即可命中：只要声母、韵母、声调相同，同音字也算对
    if (!hit) hit = list.find(p => pyMatch(p, text));
    if (hit) hitPlane(hit, 'voice');
    else attrVoiceError(text);
}
micEl.addEventListener('click', () => {
    if (!S.running || S.paused || !isVoiceRound()) return;
    openVoiceTest();
});

/* =========================================================
   语音自检
   ========================================================= */
const vmodal = $('vmodal');
let vTestRunning = false, vPausedByTest = false;

function vRow(k, cls, v){
    const row = document.createElement('div');
    row.className = 'vrow' + (cls ? ' ' + cls : '');
    row.innerHTML = '<div class="k">' + k + '</div><div class="v">' + v + '</div>';
    $('vSteps').appendChild(row);
    return row;
}
function vAdvice(html){ $('vAdvice').innerHTML = html; }

function openVoiceTest(){
    vmodal.classList.add('on');
    vPausedByTest = false;
    // 自检期间冻结战场，避免玩家在读报告时掉生命。
    if (S.running && !S.paused){ S.paused = true; stage.classList.add('paused'); vPausedByTest = true; }
    stopListening();
    runVoiceTest();
}
function closeVoiceTest(resume){
    vmodal.classList.remove('on');
    const wasPaused = vPausedByTest;
    vPausedByTest = false;
    if (wasPaused){
        S.paused = false; stage.classList.remove('paused');
        syncUI();
        if (resume !== false && S.running && isVoiceRound()) startListening();
    }
}
function runVoiceTest(){
    if (vTestRunning) return;
    vTestRunning = true;
    $('vSteps').innerHTML = '';
    $('vMeter').style.width = '0%';
    vAdvice(t('vtWorking'));

    const Ctor = SR();
    if (!Ctor){
        vRow(t('vtApi'), 'bad', t('vtNoApi'));
        vAdvice(t('vtNoApiAdvice'));
        vTestRunning = false;
        return;
    }
    vRow(t('vtApi'), 'ok', t('vtApiOk'));

    // 1) 权限状态
    const permRow = vRow(t('vtPerm'), 'wait', t('vtPermPrompt'));
    if (navigator.permissions && navigator.permissions.query){
        navigator.permissions.query({ name:'microphone' }).then(st => {
            const map = { granted:t('vtPermGranted'), denied:t('vtPermDenied'), prompt:t('vtPermPrompt') };
            permRow.className = 'vrow ' + (st.state === 'granted' ? 'ok' : (st.state === 'denied' ? 'bad' : 'wait'));
            permRow.querySelector('.v').textContent = map[st.state] || st.state;
        }).catch(() => {});
    }

    // 2) 麦克风是否真的收到声音
    let peak = 0, meterStopped = false, levelFailed = false;
    const levelRow = vRow(t('vtLevel'), 'wait', t('vtWorking'));
    const endLevel = () => {
        if (levelFailed) return;   // 保留更具体的失败原因
        if (peak > 0.012){
            levelRow.className = 'vrow ok';
            levelRow.querySelector('.v').textContent = t('vtLevelOk') + ' (' + peak.toFixed(3) + ')';
        } else {
            levelRow.className = 'vrow wait';
            levelRow.querySelector('.v').textContent = t('vtLevelSilent');
        }
    };

    function recognizeTest(){
        const row = vRow(t('vtRec'), 'wait', t('vtWorking'));
        let finished = false;
        const finish = (cls, txt, advice, code) => {
            if (finished) return;
            finished = true;
            row.className = 'vrow ' + cls;
            row.querySelector('.v').textContent = txt;
            let html = advice || '';
            if (code && code !== 'not-allowed' && peak <= 0.012) html = t('vtAdvSilent') + '<br>' + html;
            vAdvice(html || t('vtWorking'));
            vTestRunning = false;
        };
        let r;
        try { r = new Ctor(); }
        catch (e){ finish('bad', t('vtErrOther') + ' [' + e.name + ']', t('vtErrOther')); return; }
        r.lang = 'zh-CN'; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
        r.onresult = ev => {
            const res = ev.results[0];
            const txt = res && res[0] ? res[0].transcript : '';
            finish('ok', t('vtRecOk') + '「' + txt + '」', t('vtAdvOk'));
        };
        r.onerror = ev => {
            const e = ev.error;
            const m = {
                'not-allowed':[t('vtErrNotAllowed'), t('vtAdvNotAllowed')],
                'service-not-allowed':[t('vtErrService'), t('vtAdvService')],
                'network':[t('vtErrNetwork'), t('vtAdvNetwork')],
                'audio-capture':[t('vtErrCapture'), t('vtAdvCapture')],
                'no-speech':[t('vtErrNoSpeech'), t('vtAdvNoSpeech')],
                'aborted':[t('vtErrAborted'), t('vtAdvNoSpeech')]
            }[e] || [t('vtErrOther'), t('vtErrOther')];
            finish('bad', m[0] + ' [' + e + ']', m[1], e);
        };
        r.onend = () => { if (!finished) finish('bad', t('vtErrNoSpeech') + ' [no-speech]', t('vtAdvNoSpeech'), 'no-speech'); };
        try { r.start(); }
        catch (e){
            // 上一个识别实例可能还没完全释放，稍后重试。
            if (e && e.name === 'InvalidStateError'){
                setTimeout(() => { try { r.start(); } catch (e2) { finish('bad', t('vtErrOther') + ' [' + e2.name + ']', t('vtErrOther')); } }, 450);
                return;
            }
            finish('bad', t('vtErrOther') + ' [' + e.name + ']', t('vtErrOther'));
            return;
        }
        setTimeout(() => { if (!finished){ try { r.stop(); } catch (e) {} } }, 7000);
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        levelFailed = true;
        levelRow.className = 'vrow bad';
        levelRow.querySelector('.v').textContent = t('vtLevelErr');
        endLevel();
        recognizeTest();
        return;
    }
    navigator.mediaDevices.getUserMedia({ audio:true }).then(stream => {
        let ac, src, an, buf;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) throw new Error('no AudioContext');
            ac = new AC();
            src = ac.createMediaStreamSource(stream);
            an = ac.createAnalyser();
            an.fftSize = 1024;
            src.connect(an);
            buf = new Float32Array(an.fftSize);
        } catch (e){
            levelFailed = true;
            levelRow.className = 'vrow bad';
            levelRow.querySelector('.v').textContent = t('vtLevelErr') + ' (' + e.message + ')';
            endLevel();
            recognizeTest();
            return;
        }
        const loop = () => {
            if (meterStopped) return;
            an.getFloatTimeDomainData(buf);
            for (let i = 0; i < buf.length; i++){
                const v = Math.abs(buf[i]);
                if (v > peak) peak = v;
            }
            $('vMeter').style.width = Math.min(100, Math.round(peak * 400)) + '%';
            requestAnimationFrame(loop);
        };
        loop();
        setTimeout(() => {
            meterStopped = true;
            try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
            endLevel();
            recognizeTest();
        }, 2600);
    }).catch(err => {
        levelFailed = true;
        levelRow.className = 'vrow bad';
        levelRow.querySelector('.v').textContent = t('vtLevelErr') + ' (' + err.name + ')';
        endLevel();
        recognizeTest();
    });
}
$('vRun').onclick = runVoiceTest;
$('vClose').onclick = () => closeVoiceTest();
$('vClose2').onclick = () => closeVoiceTest();
$('vRetry').onclick = () => {
    voiceSkip = false;
    closeVoiceTest(false);
    if (S.running && isVoiceRound()){ startListening(); toast(t('micRetryHint')); }
};
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && vmodal.classList.contains('on')){ e.preventDefault(); closeVoiceTest(); }
});

/* =========================================================
   朗读：第一、二关自动读出词语
   —— 使用教材录音原声（内嵌 mp3），不使用浏览器合成发音
   —— 严格串行：同一时刻只读一个词，绝不重叠
   ========================================================= */
let readOn = localStorage.getItem('kongxizhan_read') !== '0';
/* 严格串行朗读队列：同一时刻只读一个词，绝不重叠 */
const speakState = { speaking:false, queue:[], curEl:null, curAudio:null, curTTS:null };
const SPEAK_GAP = 200;      // 两个词之间的停顿
const SPEAK_MAX_WAIT = 6000;// 兜底超时，避免 onended 不触发导致永久静音
const SPEAK_MAX_QUEUE = 6;  // 队列上限，避免积压过多
/* 音频元素缓存：word → HTMLAudioElement */
const _audioCache = new Map();
function getWordAudio(word){
    const src = WORD_AUDIO[word];
    if (!src) return null;
    let el = _audioCache.get(word);
    if (!el){
        el = new Audio(src);
        el.preload = 'auto';
        _audioCache.set(word, el);
    }
    return el;
}
function speakNext(){
    if (speakState.speaking) return;
    // 取出下一个待读词；已被击落/飞走的炸弹不再朗读
    let job = null;
    while (speakState.queue.length){
        const j = speakState.queue.shift();
        if (j.el && !j.el.isConnected) continue;
        if (j.plane && j.plane.doomed) continue;   // 已被击落，不必再读
        job = j; break;
    }
    if (!job){ speakState.speaking = false; return; }

    speakState.speaking = true;
    speakState.curEl = job.el;
    if (job.el && job.el.isConnected) job.el.classList.add('reading');

    const audio = getWordAudio(job.word);
    let finished = false;
    const done = () => {
        if (finished) return;
        finished = true;
        clearTimeout(guard);
        if (speakState.curEl && speakState.curEl.isConnected) speakState.curEl.classList.remove('reading');
        speakState.curEl = null;
        speakState.speaking = false;
        speakState.curAudio = null;
        // 上一个词读完，才开始下一个，保证一个一个先后出声
        if (speakState.queue.length) setTimeout(speakNext, SPEAK_GAP);
    };
    // 兜底：个别环境不触发 ended，超时后释放锁，避免之后再也不出声
    const guard = setTimeout(done, SPEAK_MAX_WAIT);

    if (!audio){
        // 教材录音里没有这个词的整词快读 → 改用系统/网页默认发音，仍保持严格串行
        speakByTTS(job.word, done);
        return;
    }
    speakState.curAudio = audio;     // 先登记，再播放，避免同步异常时留下悬空引用
    audio.volume = muted ? 0 : 1;
    try { audio.currentTime = 0; } catch (e) {}
    audio.onended = done;
    audio.onerror = () => done();
    try {
        const pr = audio.play();
        if (pr && typeof pr.catch === 'function'){
            pr.catch(() => {
                done();
                // 浏览器拦截自动播放：关闭朗读并提示
                readOn = false;
                localStorage.setItem('kongxizhan_read', '0');
                applyStaticText();
                toast(t('readBlocked'));
            });
        }
    } catch (e){ done(); }
}
/* 系统/网页默认发音（speechSynthesis）：用于教材录音缺失的词 */
let ttsTimer = null;
function speakByTTS(text, done){
    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){ done(); return; }
    try{
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.92;
        u.pitch = 1;
        u.volume = muted ? 0 : 1;
        u.onend = () => { speakState.curTTS = null; done(); };
        u.onerror = () => { speakState.curTTS = null; done(); };
        speakState.curTTS = u;
        window.speechSynthesis.speak(u);
        clearInterval(ttsTimer);
        ttsTimer = setInterval(() => {
            if (!speakState.curTTS){ clearInterval(ttsTimer); return; }
            try { const ss = window.speechSynthesis; if (ss && ss.paused) ss.resume(); } catch (e) {}
        }, 5000);
    }catch(e){ done(); }
}
function speakWord(word, el, plane){
    if (!readOn || !S.running || S.paused) return;
    if (!WORD_AUDIO[word] && !TTS_WORDS.has(word)) return;
    speakState.queue.push({ word:word, el: el || null, plane: plane || null });
    if (speakState.queue.length > SPEAK_MAX_QUEUE) speakState.queue.shift();
    if (!speakState.speaking) speakNext();
}
function stopSpeaking(){
    speakState.queue.length = 0;
    if (speakState.curEl && speakState.curEl.isConnected) speakState.curEl.classList.remove('reading');
    speakState.curEl = null;
    speakState.speaking = false;
    if (speakState.curAudio){
        try { speakState.curAudio.pause(); } catch (e) {}
        speakState.curAudio = null;
    }
    if (speakState.curTTS){
        try { window.speechSynthesis.cancel(); } catch (e) {}
        speakState.curTTS = null;
    }
    clearInterval(ttsTimer);
}
/* 静音开关时同步正在播放的朗读音量 */
function syncSpeakVolume(){
    if (speakState.curAudio){
        try { speakState.curAudio.volume = muted ? 0 : 1; } catch (e) {}
    }
    if (speakState.curTTS){
        // 正在朗读的默认发音无法中途改音量，静音时直接取消
        if (muted){
            try { window.speechSynthesis.cancel(); } catch (e) {}
            speakState.curTTS = null;
        } else {
            try { speakState.curTTS.volume = 1; } catch (e) {}
        }
    }
}

/* =========================================================
   流程
   ========================================================= */
function clearField(){
    S.ending = false;
    stage.classList.remove('ending');

function planeDur(){
    if (S.mode === 'endless'){
        const d = Math.max(6, S.endlessDur - Math.floor(S.kills / 5) * 0.7);
        return d * rand(.92, 1.08);
    }
    return DIFF[S.diff].dur * ROUNDS[S.roundIdx].speed * rand(.9, 1.1);
}

    const iv = DIFF[S.diff].spawn * (S.mode === 'endless'

}

/* 漏词炸弹：下落完成后触发爆炸，动画结束后移除。 */
let missBombIndex = 0;
function dropMissBomb(word, onComplete){
    const box = $('missBombs');
    if (!box){ if (onComplete) onComplete(); return; }
    const b = document.createElement('div');
    b.className = 'missbomb';
    const cmd = $('cmd');
    const stageRect = stage.getBoundingClientRect();
    const cmdRect = cmd.getBoundingClientRect();
    const lane = missBombIndex++ % 3;
    const targetX = Math.min(stage.clientWidth - 42, Math.max(0, cmdRect.right - stageRect.left + 14 + lane * 32));
    b.style.left = targetX + 'px';
    b.style.setProperty('--drop-height', -Math.max(120, stage.clientHeight * .55) + 'px');
    b.innerHTML = '<i></i><span class="bomb-word"></span><span class="bomb-smoke"></span><span class="bomb-fire"></span><span class="bomb-ring"></span>';
    b.querySelector('.bomb-word').textContent = word || '';
    for (let i = 0; i < 8; i++){
        const spark = document.createElement('span');
        spark.className = 'bomb-spark';
        const angle = Math.PI + (i / 7) * Math.PI;
        spark.style.setProperty('--sx', Math.cos(angle) * 90 + 'px');
        spark.style.setProperty('--sy', Math.sin(angle) * 90 - 12 + 'px');
        b.appendChild(spark);
    }
    b.addEventListener('animationend', e => {
        if (e.target !== b || !b.isConnected) return;
        if (e.animationName === 'bombDrop'){
            b.classList.add('detonated');
            cmd.classList.add('crying');
            cmdReact('sad', null, 1700);
            SFX.boom();
        } else if (e.animationName === 'bombClear'){
            b.remove();
            if (!box.querySelector('.missbomb.detonated')) cmd.classList.remove('crying');
            if (onComplete) onComplete();
        }
    });
    box.appendChild(b);
}
function onEscape(plane){
    if (!S.running || S.ending) return;
    S.active = S.active.filter(p => p !== plane);
    plane.el.remove();
    S.escaped++;
    S.combo = 0;
    S.lives--;
    S.missWords.add(plane.word.word);
    logMiss(plane.word.word);
    const finalMiss = S.lives <= 0;
    dropMissBomb(plane.word.word, () => {
        if (finalMiss && S.ending) gameOver();
    });
    SFX.miss();
    cmdReact('sad', t('cmdMiss'), 1400);
    pop(stage.getBoundingClientRect().width - 90, 90, t('popMissed'), '#ff6b6b');
    toast(tf('toastEscaped', { w: plane.word.word }));
    syncUI();
    S.queue.push(plane.word);
    if (finalMiss){
        S.ending = true;
        S.paused = true;
        clearTimeout(S.spawnTimer);
        stopListening(); stopSpeaking();
        stage.classList.add('paused', 'ending');
        return;
    }
    if (S.mode !== 'endless') checkRoundEnd();
}

    if (S.queue.length || S.active.length) return;

/* =========================================================
   开火
   ========================================================= */
function tryShoot(val){
    if (!S.running || S.paused) return;
    const v = norm(val);
    if (!v) return;
    const list = S.active.filter(p => !p.doomed);
    let locked = null;
    for (const p of list){
        if (p.keys.some(k => k === v)) { locked = p; break; }
    }
    if (locked){ hitPlane(locked, 'type'); return; }
    let anyPrefix = false;
    for (const p of list){
        const ok = p.keys.some(k => k.startsWith(v));
        p.el.classList.toggle('locked', ok);
        if (ok) anyPrefix = true;
    }
    if (!anyPrefix && v.length >= 3 && !input.classList.contains('bad')){
        input.classList.add('bad');
        setTimeout(() => input.classList.remove('bad'), 380);
    }
}
function hitPlane(plane, via){
    plane.doomed = true;
    plane.el.classList.add('doomed');
    [...planesLayer.children].forEach(c => c.classList.remove('locked'));

    const pos = stagePos(plane.el.querySelector('.wordtag'));
    const m = stagePos(barrelToggle > 0 ? $('mz1') : $('mz2'));
    const ang = Math.atan2(pos.x - m.x, m.y - pos.y) * 180 / Math.PI;
    aim.style.transform = 'rotate(' + clamp(ang, -75, 75) + 'deg)';
    SFX.shoot();

    /* ---- 先结算：不依赖动画帧 ---- */
    S.combo++;
    S.bestCombo = Math.max(S.bestCombo, S.combo);
    const mul = comboMul();
    const bonus = (via === 'type' && norm(plane.word.word) === norm(input.value)) ? 1.2 : 1;
    const gain = Math.round(100 * mul * DIFF[S.diff].mul * bonus);
    S.score += gain;
    S.kills++; S.roundKills++;
    S.doneWords.add(plane.word.word);
    S.missWords.delete(plane.word.word);
    logHit(plane.word.word);
    S.active = S.active.filter(p => p !== plane);
    input.value = '';
    buildWordList();
    syncUI();
    cmdReact('fire', S.combo > 0 && S.combo % 6 === 0 ? t('cmdCheer') : t('cmdFire'), 1200);
    $('chipCombo').classList.remove('hot'); void $('chipCombo').offsetWidth; $('chipCombo').classList.add('hot');
    if (S.combo % 6 === 0){ SFX.level(); toast(tf('toastCombo', { n: S.combo })); }
    if (S.mode === 'endless' && S.kills % 8 === 0) toast(tf('toastWave', { n: S.kills / 8 + 1 }));

    /* ---- 表现层 ---- */
    fireShell(pos.x, pos.y, () => {
        explode(pos.x, pos.y, true);
        SFX.boom(); SFX.hit();
        plane.el.classList.add('crash');
        pop(pos.x, pos.y, '+' + gain + (mul > 1 ? ' ×' + mul : ''), mul >= 3 ? '#ffd166' : '#ffffff');
    });
    setTimeout(() => plane.el.remove(), 1500);
    setTimeout(() => { aim.style.transform = 'rotate(0deg)'; }, 260);

    if (S.mode === 'endless'){ scheduleSpawn(); }
    else checkRoundEnd();
}
